version: "3.9"

services:
  web:
    build: .

    command: "python3 manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:15

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7


  celery:
    build: .

    command: celery -A config worker -l info
    env_file:
      - .env
    depends_on:
      - redis
      - db

  celery-beat:
    build: .

    command: celery -A config beat -l info
    env_file:
      - .env
    depends_on:
      - redis
      - db

volumes:
  postgres_data:
